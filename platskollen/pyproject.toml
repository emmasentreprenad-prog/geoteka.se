[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platskollen"
version = "0.1.0"
description = "Sweden-only pre-feasibility site-suitability screening agent (Trust Stage 1 scaffold)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
